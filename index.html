<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="same-origin" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="description" content="Thrive ordering agent for Eurest Cafe, running in a Microsoft Teams window." />
<title>Thrive Order Agent — Eurest Cafe</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/css/fonts.css" />
<link rel="stylesheet" href="assets/css/shell.css" />
<script src="assets/js/theme.js"></script>
<script src="assets/js/prefs.js"></script>
</head>
<body>

<header>
  <div class="brand">
    <!-- Centric OS mark (brand guide p18–19); colors flip with theme -->
    <svg class="mark" viewBox="10 10 60 80" aria-hidden="true">
      <path class="m-a" d="M50 10 A40 40 0 0 0 50 90 Z"/>
      <path class="m-b" d="M50 30 A20 20 0 0 0 50 70 Z"/>
      <path class="m-c" d="M50 30 A20 20 0 0 1 50 70 Z"/>
    </svg>
    <div class="wordmark">
      <div class="sub">Compass Digital</div>
      <div class="name">Centric OS</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="context">
    <div class="title">Teams Ordering Agent</div>
    <div class="desc">Thrive ordering for Eurest Cafe, inside Microsoft Teams</div>
  </div>
  <div class="tagline">Powering Today. <b>Shaping Tomorrow.</b></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Device view">
      <button type="button" data-view-btn="desktop" aria-pressed="false" title="Desktop view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.8"/><path d="M9 20h6M12 16.5V20" stroke-linecap="round"/></svg>
        <span>Desktop</span>
      </button>
      <button type="button" data-view-btn="mobile" aria-pressed="true" title="Mobile view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 18.5h3" stroke-linecap="round"/></svg>
        <span>Mobile</span>
      </button>
    </div>
    <button class="cue-btn" id="cueBtn" type="button" aria-pressed="true" title="Show or hide step-by-step app cues">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5" stroke-dasharray="3 3.2"/></svg>
      <span>Cues <b class="cue-state">on</b></span>
    </button>
  </div>
  <button class="theme-btn" id="themeBtn" type="button" title="Switch theme" aria-label="Switch between light and dark theme">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M20 13.5A8.5 8.5 0 1110.5 4 7 7 0 0020 13.5z"/>
    </svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5"/>
      <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main class="stage" id="stage">
  <div class="loading" role="status">Loading Teams…</div>
  <!-- Device: full stage on desktop, a phone frame on mobile (see shell.css) -->
  <div class="device">
    <div class="statusbar" aria-hidden="true">
      <span class="clock">9:41</span>
      <span class="island"></span>
      <svg class="sys" viewBox="0 0 54 12" fill="currentColor">
        <rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="4.5" y="5.5" width="3" height="6.5" rx=".8"/>
        <rect x="9" y="3" width="3" height="9" rx=".8"/><rect x="13.5" y="0" width="3" height="12" rx=".8"/>
        <path d="M27 2.2a9 9 0 016.4 2.6l1.3-1.3a10.8 10.8 0 00-15.4 0l1.3 1.3A9 9 0 0127 2.2zm0 3.6a5.4 5.4 0 013.8 1.6l1.3-1.3a7.2 7.2 0 00-10.2 0l1.3 1.3A5.4 5.4 0 0127 5.8zM27 9.4l2.4-2.4a3.4 3.4 0 00-4.8 0z"/>
        <rect x="37.5" y=".8" width="14" height="10.4" rx="3" fill="none" stroke="currentColor" stroke-opacity=".45"/>
        <rect x="39.2" y="2.5" width="10.6" height="7" rx="1.6"/><path d="M52.6 4.2v3.6a1.8 1.8 0 000-3.6z" fill-opacity=".45"/>
      </svg>
    </div>
    <div class="screen" id="screen">
      <iframe id="app" class="app" title="Thrive ordering agent in Microsoft Teams"
              src="teams/ordering.html" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>
  </div>
</main>

<footer>
  <span class="dot" aria-hidden="true"></span>
  <span>Centric OS · Teams Ordering Agent</span>
  <span class="right">© 2026 Compass Digital. All rights reserved.</span>
</footer>

<script src="assets/js/shell.js" defer></script>
</body>
</html>
